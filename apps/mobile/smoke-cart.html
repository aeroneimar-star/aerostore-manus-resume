<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEROSTORE — Carrinho Privado</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #10100F;
    color: #E8E8E6;
    min-height: 100vh;
  }
  .safe-area-top { height: 54px; background: #10100F; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 16px; border-bottom: 1px solid #1E1E1C;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .back-btn {
    width: 32px; height: 32px; border-radius: 8px; background: #1A1A18;
    border: none; color: #E8E8E6; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  .header-right { font-size: 13px; color: #8A8A88; }
  .content { padding: 16px; }

  .cart-item {
    display: flex; gap: 12px; padding: 16px; margin-bottom: 12px;
    background: #1A1A18; border-radius: 12px; border: 1px solid #252523;
  }
  .cart-item-img {
    width: 80px; height: 80px; border-radius: 8px; background: #252523;
    display: flex; align-items: center; justify-content: center;
    color: #8A8A88; font-size: 11px; overflow: hidden; flex-shrink: 0;
  }
  .cart-item-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
  .cart-item-info { flex: 1; }
  .cart-item-brand { font-size: 11px; color: #8A8A88; text-transform: uppercase; letter-spacing: 0.5px; }
  .cart-item-title { font-size: 15px; font-weight: 600; margin: 4px 0; }
  .cart-item-variant { font-size: 12px; color: #8A8A88; margin-bottom: 8px; }
  .cart-item-price { font-size: 16px; font-weight: 700; }
  .cart-item-price .compare { font-size: 12px; color: #8A8A88; text-decoration: line-through; margin-left: 8px; }
  .cart-item-price .promo { color: #FFD700; }
  .cart-item-qty { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 6px; background: #252523;
    border: none; color: #E8E8E6; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-value { font-size: 14px; font-weight: 600; min-width: 24px; text-align: center; }
  .cart-item-remove {
    background: none; border: none; color: #FF6B6B; font-size: 12px;
    cursor: pointer; padding: 4px 8px; margin-top: 4px;
  }

  .cart-empty {
    text-align: center; padding: 60px 24px;
  }
  .cart-empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .cart-empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .cart-empty-text { font-size: 14px; color: #8A8A88; line-height: 1.5; }

  .cart-footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #1A1A18; border-top: 1px solid #252523;
    padding: 16px; padding-bottom: 34px;
  }
  .cart-subtotal-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
  .cart-subtotal-label { font-size: 14px; color: #8A8A88; }
  .cart-subtotal-value { font-size: 18px; font-weight: 700; }
  .cart-checkout-btn {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    background: #E8E8E6; color: #10100F; font-size: 15px; font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer;
  }
  .cart-checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .cart-header-note {
    font-size: 12px; color: #8A8A88; text-align: center;
    padding: 8px 16px; border-bottom: 1px solid #1E1E1C;
  }
  .badge {
    background: #FFD700; color: #10100F; font-size: 11px; font-weight: 700;
    border-radius: 10px; padding: 2px 6px; margin-left: 4px;
  }
</style>
</head>
<body>

<div class="safe-area-top"></div>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <button class="back-btn">‹</button>
    <h1>Carrinho <span class="badge">2</span></h1>
  </div>
  <div class="header-right">ID: aero-000001</div>
</div>

<div class="cart-header-note">Preços e disponibilidade serão confirmados antes do pedido.</div>

<div class="content">
  <!-- Item 1: Polo Pima Marinho -->
  <div class="cart-item">
    <div class="cart-item-img">
      <img src="https://via.placeholder.com/80/252523/8A8A88?text=Polo" alt="Polo Pima Marinho" />
    </div>
    <div class="cart-item-info">
      <div class="cart-item-brand">Osklen</div>
      <div class="cart-item-title">Polo Pima Marinho</div>
      <div class="cart-item-variant">Marinho · M</div>
      <div class="cart-item-price">
        <span class="price-value">R$ 459,90</span>
      </div>
      <div class="cart-item-qty">
        <button class="qty-btn">−</button>
        <span class="qty-value">2</span>
        <button class="qty-btn">+</button>
      </div>
      <button class="cart-item-remove">Remover</button>
    </div>
  </div>

  <!-- Item 2: Camisa Social Branca (com promoção) -->
  <div class="cart-item">
    <div class="cart-item-img">
      <img src="https://via.placeholder.com/80/252523/8A8A88?text=Camisa" alt="Camisa Social Branca" />
    </div>
    <div class="cart-item-info">
      <div class="cart-item-brand">AEROSTORE</div>
      <div class="cart-item-title">Camisa Social Branca</div>
      <div class="cart-item-variant">Branco · G</div>
      <div class="cart-item-price">
        <span class="price-value promo">R$ 389,90</span>
        <span class="compare">R$ 429,90</span>
      </div>
      <div class="cart-item-qty">
        <button class="qty-btn">−</button>
        <span class="qty-value">1</span>
        <button class="qty-btn">+</button>
      </div>
      <button class="cart-item-remove">Remover</button>
    </div>
  </div>
</div>

<!-- Footer -->
<div class="cart-footer">
  <div class="cart-subtotal-row">
    <span class="cart-subtotal-label">Subtotal</span>
    <span class="cart-subtotal-value" id="subtotal">R$ 1.309,70</span>
  </div>
  <button class="cart-checkout-btn">Revisar entrega</button>
</div>

<script>
  // Formatação BRL correta
  const formatBrl = (cents) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(cents / 100);

  // Calcular subtotal real
  const items = [
    { price: 45990, qty: 2 },
    { price: 38990, qty: 1 }
  ];
  const subtotal = items.reduce((sum, item) => sum + item.price * item.qty, 0);
  document.getElementById('subtotal').textContent = formatBrl(subtotal);
</script>

</body>
</html>
